plugins {
    id 'com.android.application'
}

// The web app lives at the repo root in www/. Point the assets source set
// straight at it — no copy task, no task-dependency pitfalls.
def wwwDir = rootProject.file('../www')

android {
    namespace 'com.chromatoons.app'
    compileSdk 34

    defaultConfig {
        applicationId 'bhootiyadreamstv.moboapp.chromatoons'
        minSdk 24
        targetSdk 34
        versionCode 187
        versionName '174'
    }

    sourceSets {
        main {
            assets.srcDirs += wwwDir
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ships installable out of the box via the debug keystore.
            // Create your own keystore for a public release (see docs/BUILD.md).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No third-party dependencies on purpose: the app targets the platform SDK
// only, so the build never has to download AndroidX artifacts.
